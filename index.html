<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="PetMall 宠物用品电商单文件演示系统">
  <title>PetMall 宠物用品电商系统</title>
  <style>
    :root {
      --brand: #2563eb;
      --brand-dark: #1d4ed8;
      --ink: #172033;
      --muted: #667085;
      --line: #e4e7ec;
      --surface: #f5f7fb;
      --white: #fff;
      --success: #15803d;
      --warning: #b45309;
      --danger: #dc2626;
      --shadow: 0 14px 34px rgba(23, 32, 51, .09);
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body {
      color: var(--ink);
      background: var(--surface);
      font-family: Inter, "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
    }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    a { color: inherit; text-decoration: none; }
    img { display: block; max-width: 100%; }

    .container { width: min(1200px, calc(100% - 28px)); margin: 0 auto; }
    .muted { color: var(--muted); }
    .price { color: var(--danger); font-weight: 800; }
    .hidden { display: none !important; }
    .empty { padding: 52px 20px; color: var(--muted); text-align: center; }
    .page { padding: 36px 0 64px; }
    .page-title { margin: 0; font-size: 26px; }
    .page-subtitle { margin: 8px 0 0; color: var(--muted); }
    .section-heading {
      display: flex; align-items: flex-end; justify-content: space-between;
      gap: 18px; margin-bottom: 22px;
    }
    .section-heading h2 { margin: 0; font-size: 25px; }
    .section-heading p { margin: 7px 0 0; color: var(--muted); }

    .btn {
      display: inline-flex; min-height: 38px; align-items: center; justify-content: center;
      gap: 7px; padding: 8px 16px; border: 1px solid var(--line);
      border-radius: 7px; background: #fff; color: var(--ink);
      font-weight: 600; transition: .18s ease;
    }
    .btn:hover { border-color: #b7c2d3; transform: translateY(-1px); }
    .btn-primary { border-color: var(--brand); background: var(--brand); color: #fff; }
    .btn-primary:hover { border-color: var(--brand-dark); background: var(--brand-dark); }
    .btn-danger { border-color: #fecaca; background: #fff1f2; color: var(--danger); }
    .btn-success { border-color: #bbf7d0; background: #f0fdf4; color: var(--success); }
    .btn-warning { border-color: #fed7aa; background: #fff7ed; color: var(--warning); }
    .btn-sm { min-height: 31px; padding: 5px 10px; font-size: 13px; }
    .btn-block { width: 100%; }
    .btn:disabled { cursor: not-allowed; opacity: .55; transform: none; }

    .field { display: flex; flex-direction: column; gap: 7px; }
    .field label { color: #344054; font-size: 13px; font-weight: 700; }
    input, select, textarea {
      width: 100%; border: 1px solid #cfd6e2; border-radius: 7px;
      background: #fff; color: var(--ink); outline: none; padding: 10px 11px;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(37, 99, 235, .1); }
    textarea { min-height: 94px; resize: vertical; }
    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .form-grid .span-2 { grid-column: span 2; }
    .form-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }

    .panel {
      border: 1px solid var(--line); border-radius: 8px; background: #fff;
    }
    .panel-pad { padding: 22px; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 13px 12px; border-bottom: 1px solid #eef0f4; text-align: left; vertical-align: middle; }
    th { background: #fafbfc; color: #475467; font-size: 12px; text-transform: uppercase; letter-spacing: .03em; }
    tr:last-child td { border-bottom: 0; }

    .tag {
      display: inline-flex; align-items: center; padding: 4px 8px;
      border-radius: 999px; background: #eff6ff; color: var(--brand);
      font-size: 12px; font-weight: 700;
    }
    .tag-green { background: #f0fdf4; color: var(--success); }
    .tag-orange { background: #fff7ed; color: var(--warning); }
    .tag-red { background: #fff1f2; color: var(--danger); }
    .tag-gray { background: #f2f4f7; color: #475467; }

    .user-header {
      position: sticky; top: 0; z-index: 20; border-bottom: 1px solid var(--line);
      background: rgba(255,255,255,.97);
    }
    .user-header-inner {
      display: flex; min-height: 70px; align-items: center; gap: 24px;
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-mark {
      display: grid; width: 40px; height: 40px; place-items: center;
      border-radius: 8px; background: var(--brand); color: #fff; font-size: 21px; font-weight: 900;
    }
    .brand-copy { display: flex; flex-direction: column; }
    .brand-copy strong { font-size: 18px; }
    .brand-copy small { margin-top: 3px; color: var(--muted); font-size: 11px; }
    .main-nav { display: flex; flex: 1; align-items: center; gap: 18px; }
    .main-nav a { color: #475467; font-size: 14px; font-weight: 600; }
    .main-nav a.active { color: var(--brand); }
    .header-actions { display: flex; align-items: center; gap: 10px; }
    .header-user { display: flex; align-items: center; gap: 8px; color: #344054; }
    .avatar {
      display: grid; width: 32px; height: 32px; place-items: center;
      border-radius: 50%; background: #dbeafe; color: var(--brand); font-weight: 800;
    }

    .hero {
      position: relative; display: flex; min-height: 480px; align-items: center;
      background-image: var(--hero-image); background-position: center; background-size: cover;
    }
    .hero::before { content: ""; position: absolute; inset: 0; background: rgba(8, 17, 34, .68); }
    .hero-content { position: relative; z-index: 1; max-width: 640px; color: #fff; }
    .hero-label { color: #bfdbfe; font-size: 12px; font-weight: 800; letter-spacing: .12em; }
    .hero h1 { margin: 17px 0 0; font-size: 50px; line-height: 1.12; }
    .hero p { margin: 20px 0 26px; color: #e2e8f0; font-size: 17px; line-height: 1.75; }
    .hero-actions { display: flex; gap: 11px; }

    .category-grid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 13px; }
    .category-card {
      display: flex; min-height: 108px; align-items: center; justify-content: center;
      border: 1px solid var(--line); border-radius: 8px; background: #fff;
      color: #344054; flex-direction: column; gap: 10px;
    }
    .category-card:hover { border-color: #93c5fd; color: var(--brand); }
    .category-icon {
      display: grid; width: 43px; height: 43px; place-items: center;
      border-radius: 8px; background: #eff6ff; color: var(--brand); font-size: 22px;
    }

    .product-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 17px; }
    .product-card {
      overflow: hidden; border: 1px solid var(--line); border-radius: 8px;
      background: #fff; transition: .2s ease;
    }
    .product-card:hover { box-shadow: var(--shadow); transform: translateY(-3px); }
    .product-image { position: relative; aspect-ratio: 1 / 1; overflow: hidden; background: #eef2f6; }
    .product-image img { width: 100%; height: 100%; object-fit: cover; }
    .stock-mask {
      position: absolute; inset: 0; display: grid; place-items: center;
      background: rgba(23,32,51,.65); color: #fff; font-weight: 800;
    }
    .product-content { padding: 15px; }
    .product-content h3 {
      overflow: hidden; margin: 7px 0 6px; font-size: 16px;
      text-overflow: ellipsis; white-space: nowrap;
    }
    .product-content p {
      min-height: 38px; margin: 0; color: var(--muted); font-size: 13px; line-height: 1.5;
    }
    .product-footer {
      display: flex; align-items: flex-end; justify-content: space-between;
      gap: 10px; margin-top: 14px;
    }
    .product-footer small { display: block; margin-top: 4px; color: #98a2b3; }

    .filter-panel {
      display: flex; flex-wrap: wrap; gap: 11px; align-items: center;
      margin-bottom: 20px; padding: 16px; border: 1px solid var(--line);
      border-radius: 8px; background: #fff;
    }
    .filter-panel input, .filter-panel select { width: auto; min-width: 160px; }

    .detail-grid {
      display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(340px, .9fr);
      gap: 36px; padding: 22px;
    }
    .detail-image { aspect-ratio: 1 / 1; overflow: hidden; border-radius: 8px; background: #eef2f6; }
    .detail-image img { width: 100%; height: 100%; object-fit: cover; }
    .detail-info h1 { margin: 12px 0; font-size: 31px; }
    .detail-price { margin: 25px 0 18px; padding: 18px; background: #fff7ed; color: #9a3412; }
    .detail-price strong { display: block; margin-top: 6px; font-size: 34px; }
    .qty-row { display: flex; align-items: center; gap: 14px; margin: 20px 0; }
    .qty-control {
      display: inline-grid; grid-template-columns: 34px 48px 34px; overflow: hidden;
      border: 1px solid #cfd6e2; border-radius: 7px;
    }
    .qty-control button { border: 0; background: #f8fafc; }
    .qty-control span { display: grid; place-items: center; border-left: 1px solid #e4e7ec; border-right: 1px solid #e4e7ec; }

    .list-card {
      display: grid; grid-template-columns: 76px minmax(0,1fr) auto; gap: 14px;
      align-items: center; padding: 15px 0; border-bottom: 1px solid #eef0f4;
    }
    .list-card:last-child { border-bottom: 0; }
    .list-card img { width: 76px; height: 76px; border-radius: 7px; object-fit: cover; }
    .list-card-info { display: flex; flex-direction: column; gap: 7px; }

    .checkout-grid { display: grid; grid-template-columns: minmax(0,1fr) 330px; gap: 18px; align-items: start; }
    .summary-card { position: sticky; top: 88px; padding: 20px; }
    .summary-row { display: flex; justify-content: space-between; gap: 13px; padding: 10px 0; border-bottom: 1px solid #eef0f4; }
    .summary-row:last-child { border-bottom: 0; }
    .summary-total { margin-top: 10px; font-size: 23px; }

    .address-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 13px; }
    .address-card { padding: 17px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
    .address-card.selected { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(37,99,235,.1); }
    .address-card-head { display: flex; justify-content: space-between; gap: 10px; }
    .address-card p { margin: 10px 0; color: #475467; line-height: 1.55; }

    .order-card { margin-bottom: 14px; overflow: hidden; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
    .order-head, .order-foot {
      display: flex; align-items: center; justify-content: space-between; gap: 14px;
      padding: 14px 17px;
    }
    .order-head { border-bottom: 1px solid #eef0f4; background: #fafbfc; }
    .order-body { padding: 9px 17px; }
    .order-foot { border-top: 1px solid #eef0f4; }
    .order-item { display: grid; grid-template-columns: 58px 1fr auto; gap: 12px; align-items: center; padding: 9px 0; }
    .order-item img { width: 58px; height: 58px; border-radius: 6px; object-fit: cover; }

    .auth-page {
      display: grid; min-height: 100vh; padding: 24px; place-items: center;
      background-image: var(--auth-image); background-position: center; background-size: cover;
    }
    .auth-shell {
      width: min(430px, 100%); padding: 32px; border-radius: 8px;
      background: #fff; box-shadow: 0 24px 70px rgba(15,23,42,.24);
    }
    .auth-shell h1 { margin: 22px 0 7px; font-size: 28px; }
    .auth-shell > p { margin: 0 0 23px; color: var(--muted); }
    .auth-links { margin-top: 18px; color: var(--muted); text-align: center; }
    .auth-links a { color: var(--brand); font-weight: 700; }

    .admin-layout { display: grid; min-height: 100vh; grid-template-columns: 226px minmax(0,1fr); }
    .admin-sidebar { background: #172033; color: #cbd5e1; }
    .admin-brand { display: flex; height: 76px; align-items: center; gap: 10px; padding: 0 18px; color: #fff; }
    .admin-brand .brand-mark { width: 38px; height: 38px; }
    .admin-menu { display: flex; flex-direction: column; gap: 4px; padding: 8px; }
    .admin-menu a { padding: 12px 13px; border-radius: 7px; color: #cbd5e1; font-size: 14px; }
    .admin-menu a.active, .admin-menu a:hover { background: var(--brand); color: #fff; }
    .admin-main { min-width: 0; }
    .admin-header {
      display: flex; height: 76px; align-items: center; justify-content: space-between;
      gap: 18px; padding: 0 24px; border-bottom: 1px solid var(--line); background: #fff;
    }
    .admin-content { padding: 22px; background: var(--surface); }
    .summary-grid { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 14px; }
    .summary-box { padding: 20px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
    .summary-box span { color: var(--muted); }
    .summary-box strong { display: block; margin: 10px 0 7px; font-size: 28px; }
    .chart-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 14px; margin-top: 14px; }
    .chart-card { min-width: 0; padding: 18px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
    .chart-card h3 { margin: 0 0 5px; font-size: 16px; }
    .chart-card p { margin: 0 0 12px; color: var(--muted); font-size: 12px; }
    .chart-card canvas { width: 100%; height: 280px; }

    .toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
    .toolbar-group { display: flex; flex-wrap: wrap; gap: 9px; align-items: center; }
    .toolbar input, .toolbar select { width: auto; min-width: 145px; }
    .admin-product { display: grid; grid-template-columns: 54px minmax(0,1fr); gap: 11px; align-items: center; }
    .admin-product img { width: 54px; height: 54px; border-radius: 6px; object-fit: cover; }
    .admin-product span { display: block; overflow: hidden; margin-top: 4px; color: var(--muted); font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }

    .demo-tip {
      margin-top: 15px; padding: 11px 13px; border: 1px solid #dbeafe;
      border-radius: 7px; background: #eff6ff; color: #1d4ed8; font-size: 13px;
    }
    #toast {
      position: fixed; top: 22px; right: 22px; z-index: 1000;
      display: flex; width: min(360px, calc(100% - 40px)); flex-direction: column; gap: 9px;
    }
    .toast {
      padding: 12px 15px; border: 1px solid #bbf7d0; border-radius: 7px;
      background: #f0fdf4; color: #166534; box-shadow: var(--shadow); animation: show .18s ease;
    }
    .toast.error { border-color: #fecaca; background: #fff1f2; color: #991b1b; }
    @keyframes show { from { opacity: 0; transform: translateY(-7px); } }

    .modal-backdrop {
      position: fixed; inset: 0; z-index: 50; display: grid; padding: 22px;
      place-items: center; background: rgba(15,23,42,.48);
    }
    .modal {
      width: min(660px, 100%); max-height: 90vh; overflow-y: auto; padding: 22px;
      border-radius: 8px; background: #fff; box-shadow: var(--shadow);
    }

    @media (max-width: 1000px) {
      .main-nav { display: none; }
      .product-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
      .category-grid { grid-template-columns: repeat(3, minmax(0,1fr)); }
      .summary-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
      .chart-grid { grid-template-columns: 1fr; }
      .detail-grid, .checkout-grid { grid-template-columns: 1fr; }
      .summary-card { position: static; }
    }
    @media (max-width: 760px) {
      .header-actions .desktop-only { display: none; }
      .hero { min-height: 430px; }
      .hero h1 { font-size: 35px; }
      .product-grid, .category-grid, .address-grid, .form-grid { grid-template-columns: 1fr; }
      .form-grid .span-2 { grid-column: span 1; }
      .admin-layout { grid-template-columns: 1fr; }
      .admin-sidebar { position: static; }
      .admin-menu { flex-direction: row; overflow-x: auto; }
      .admin-menu a { white-space: nowrap; }
      .admin-header, .admin-content { padding-left: 13px; padding-right: 13px; }
      .order-head, .order-foot { align-items: flex-start; flex-direction: column; }
      .list-card { grid-template-columns: 64px 1fr; }
      .list-card > .list-actions { grid-column: span 2; }
    }
  </style>
</head>

        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function toast(message, error) {
      const node = document.createElement('div');
      node.className = 'toast' + (error ? ' error' : '');
      node.textContent = message;
      toastBox.appendChild(node);
      setTimeout(() => node.remove(), 2600);
    }

    function currentUser() {
      return state.users.find(item => item.id === state.session.userId) || null;
    }

    function currentEmployee() {
      return state.employees.find(item => item.id === state.session.employeeId) || null;
    }

    function route() {
      const raw = location.hash.replace(/^#\/?/, '') || 'home';
      return raw.split('/').filter(Boolean);
    }

    function go(path) {
      location.hash = '#/' + path.replace(/^#?\/?/, '');
    }

    function categoryName(id) {
      const category = state.categories.find(item => item.id === Number(id));
      return category ? category.name : '未分类';
    }

    function userCart() {
      const user = currentUser();
      if (!user) return [];
      if (!state.carts[user.id]) state.carts[user.id] = [];
      return state.carts[user.id];
    }

    function cartDetails() {
      return userCart().map(item => {
        const product = state.products.find(product => product.id === item.productId);
        return product ? { ...item, product } : null;
      }).filter(Boolean);
    }

    function statusTag(status) {
      return '<span class="tag ' + (STATUS_CLASS[status] || '') + '">' + (ORDER_STATUS[status] || status) + '</span>';
    }

    function userHeader() {
      const user = currentUser();
      return `
        <header class="user-header">
          <div class="container user-header-inner">
            <a class="brand" href="#/home">
              <span class="brand-mark">P</span>
              <span class="brand-copy"><strong>PetMall</strong><small>宠物生活商城</small></span>
            </a>
            <nav class="main-nav">
              <a href="#/home" class="${route()[0] === 'home' ? 'active' : ''}">首页</a>
              <a href="#/products" class="${route()[0] === 'products' ? 'active' : ''}">全部商品</a>
              <a href="#/orders">我的订单</a>
              <a href="#/profile">个人中心</a>
            </nav>
            <div class="header-actions">
              <a class="btn desktop-only" href="#/cart">购物车</a>
              ${user ? `
                <span class="header-user"><span class="avatar">${esc(user.nickname.slice(0, 1))}</span>${esc(user.nickname)}</span>
                <button class="btn btn-sm" data-action="user-logout">退出</button>
              ` : `
                <a class="btn btn-sm" href="#/login">登录</a>
                <a class="btn btn-sm btn-primary" href="#/register">注册</a>
              `}
            </div>
          </div>
        </header>`;
    }

    function productCard(product) {
      return `
        <article class="product-card">
          <a href="#/product/${product.id}">
            <div class="product-image">
              <img src="${product.image}" alt="${esc(product.name)}" loading="lazy" decoding="async" onerror="this.src='${ASSETS.placeholder}'">
              ${product.stock <= 0 ? '<span class="stock-mask">暂时缺货</span>' : ''}
            </div>
          </a>
          <div class="product-content">
            <span class="tag">${esc(categoryName(product.categoryId))}</span>
            <h3><a href="#/product/${product.id}">${esc(product.name)}</a></h3>
            <p>${esc(product.subtitle)}</p>
            <div class="product-footer">
              <div><strong class="price">¥${money(product.price)}</strong><small>已售 ${product.sales || 0}</small></div>
              <button class="btn btn-primary btn-sm" data-action="add-cart" data-id="${product.id}" ${product.stock <= 0 ? 'disabled' : ''}>加入购物车</button>
            </div>
          </div>
        </article>`;
    }

    function renderHome() {
      const hot = [...state.products].filter(item => item.status === 1).sort((a, b) => b.sales - a.sales).slice(0, 8);
      return userHeader() + `
        <section class="hero" style="--hero-image:url('${ASSETS.hero}')">
          <div class="container hero-content">
            <span class="hero-label">PET DAILY ESSENTIALS</span>
            <h1>把日常所需，挑得更放心</h1>
            <p>单文件离线商城演示，包含商品浏览、购物车、模拟支付、订单管理和销售看板。</p>
            <div class="hero-actions">
              <a class="btn btn-primary" href="#/products">开始选购</a>
              <a class="btn" href="#/admin-login">进入管理后台</a>
            </div>
          </div>
        </section>
        <main class="container page">
          <div class="section-heading">
            <div><h2>按需求选购</h2><p>点击分类快速筛选商品。</p></div>
          </div>
          <div class="category-grid">
            ${state.categories.filter(item => item.status === 1).sort((a,b) => a.sort-b.sort).map(item => `
              <a class="category-card" href="#/products?categoryId=${item.id}">
                <span class="category-icon">${item.id}</span><strong>${esc(item.name)}</strong>
              </a>`).join('')}
          </div>
          <div class="section-heading" style="margin-top:50px">
            <div><h2>热销商品</h2><p>按累计销量排序。</p></div>
            <a href="#/products">查看全部</a>
          </div>
          <div class="product-grid">${hot.map(productCard).join('')}</div>
        </main>`;
    }

    function queryValue(name) {
      const hashQuery = location.hash.split('?')[1] || '';
      return new URLSearchParams(hashQuery).get(name) || '';
    }

    function renderProducts() {
      const keyword = productFilter.keyword.trim().toLowerCase();
      const categoryId = Number(productFilter.categoryId || queryValue('categoryId') || 0);
      const products = state.products.filter(item => {
        if (item.status !== 1) return false;
        if (categoryId && item.categoryId !== categoryId) return false;
        if (keyword && !(item.name + item.subtitle).toLowerCase().includes(keyword)) return false;
        return true;
      });
      return userHeader() + `
        <main class="container page">
          <div class="section-heading">
            <div><h1 class="page-title">宠物用品</h1><p class="page-subtitle">搜索、筛选并浏览本地商品数据。</p></div>
          </div>
          <form class="filter-panel" data-form="product-filter">
            <input name="keyword" placeholder="搜索商品名称" value="${esc(productFilter.keyword)}">
            <select name="categoryId">
              <option value="">全部分类</option>
              ${state.categories.map(item => `<option value="${item.id}" ${Number(productFilter.categoryId) === item.id ? 'selected' : ''}>${esc(item.name)}</option>`).join('')}
            </select>
            <button class="btn btn-primary" type="submit">查询</button>
            <button class="btn" type="button" data-action="reset-product-filter">重置</button>
          </form>
          <div class="product-grid">${products.map(productCard).join('')}</div>
          ${products.length ? '' : '<div class="empty">没有找到符合条件的商品</div>'}
        </main>`;
    }

    function renderProductDetail(id) {
      const product = state.products.find(item => item.id === Number(id) && item.status === 1);
      if (!product) return userHeader() + '<div class="container page"><div class="empty">商品不存在或已下架</div></div>';
      return userHeader() + `
        <main class="container page">
          <div class="panel detail-grid">
            <div class="detail-image"><img src="${product.image}" alt="${esc(product.name)}" onerror="this.src='${ASSETS.placeholder}'"></div>
            <div class="detail-info">
              <span class="tag">${esc(categoryName(product.categoryId))}</span>
              <h1>${esc(product.name)}</h1>
              <p class="muted">${esc(product.subtitle)}</p>
              <div class="detail-price"><span>商城价</span><strong>¥${money(product.price)}</strong></div>
              <p>库存 ${product.stock} 件 · 累计销量 ${product.sales}</p>
              <div class="qty-row">
                <strong>购买数量</strong>
                <div class="qty-control">
                  <button type="button" data-action="detail-qty" data-step="-1">-</button>
                  <span id="detail-qty">1</span>
                  <button type="button" data-action="detail-qty" data-step="1">+</button>
                </div>
              </div>
              <div class="form-actions">
                <button class="btn btn-primary" data-action="add-cart-detail" data-id="${product.id}" ${product.stock <= 0 ? 'disabled' : ''}>加入购物车</button>
                <button class="btn" data-action="buy-now" data-id="${product.id}" ${product.stock <= 0 ? 'disabled' : ''}>立即购买</button>
              </div>
              <div class="panel-pad panel" style="margin-top:24px">
                <strong>商品详情</strong>
                <p class="muted" style="line-height:1.9">${esc(product.detail)}</p>
              </div>
            </div>
          </div>
        </main>`;
    }

    function renderCart() {
      const user = currentUser();
      if (!user) return authRequired('登录后查看购物车');
      const details = cartDetails();
      const selected = details.filter(item => selectedCartIds.has(item.id));
      const total = selected.reduce((sum, item) => sum + item.product.price * item.quantity, 0);
      return userHeader() + `
        <main class="container page">
          <div class="section-heading">
            <div><h1 class="page-title">购物车</h1><p class="page-subtitle">修改数量并勾选需要结算的商品。</p></div>
            <a class="btn" href="#/products">继续选购</a>
          </div>
          <div class="panel panel-pad">
            ${details.length ? details.map(item => `
              <div class="list-card">
                <img src="${item.product.image}" alt="${esc(item.product.name)}" onerror="this.src='${ASSETS.placeholder}'">
                <div class="list-card-info">
                  <label class="header-user"><input type="checkbox" data-action="cart-select" data-id="${item.id}" ${selectedCartIds.has(item.id) ? 'checked' : ''}> ${esc(item.product.name)}</label>
                  <span class="muted">¥${money(item.product.price)} · 库存 ${item.product.stock}</span>
                </div>
                <div class="list-actions form-actions">
                  <div class="qty-control">
                    <button data-action="cart-qty" data-id="${item.id}" data-step="-1">-</button>
                    <span>${item.quantity}</span>
                    <button data-action="cart-qty" data-id="${item.id}" data-step="1">+</button>
                  </div>
                  <button class="btn btn-danger btn-sm" data-action="cart-remove" data-id="${item.id}">删除</button>
                </div>
              </div>`).join('') : '<div class="empty">购物车还是空的</div>'}
          </div>
          ${details.length ? `
            <div class="panel panel-pad" style="display:flex;justify-content:flex-end;align-items:center;gap:20px;margin-top:16px">
              <span>已选 ${selected.length} 件</span>
              <strong class="price summary-total">¥${money(total)}</strong>
              <button class="btn btn-primary" data-action="checkout" ${selected.length ? '' : 'disabled'}>去结算</button>
            </div>` : ''}
        </main>`;
    }

    function renderCheckout() {
      const user = currentUser();
      if (!user) return authRequired('登录后继续结算');
      const details = cartDetails().filter(item => selectedCartIds.has(item.id));
      if (!details.length) {
        return userHeader() + '<main class="container page"><div class="empty">请先在购物车选择商品<br><br><a class="btn btn-primary" href="#/cart">返回购物车</a></div></main>';
      }
      const total = details.reduce((sum, item) => sum + item.product.price * item.quantity, 0);
      const addresses = user.addresses || [];
      const selectedAddressId = Number(queryValue('addressId')) || (addresses[0] ? addresses[0].id : 0);
      return userHeader() + `
        <main class="container page">
          <div class="section-heading"><div><h1 class="page-title">确认订单</h1><p class="page-subtitle">选择地址并提交订单。</p></div></div>
          <div class="checkout-grid">
            <div>
              <section class="panel panel-pad" style="margin-bottom:16px">
                <h3>收货地址</h3>
                ${addresses.length ? `
                  <div class="address-grid">
                    ${addresses.map(address => `
                      <button class="address-card ${selectedAddressId === address.id ? 'selected' : ''}" data-action="select-checkout-address" data-id="${address.id}">
                        <span class="address-card-head"><strong>${esc(address.receiver)} ${esc(address.phone)}</strong>${address.isDefault ? '<span class="tag tag-green">默认</span>' : ''}</span>
                        <p>${esc(address.province + address.city + address.district + address.detail)}</p>
                      </button>`).join('')}
                  </div>` : '<div class="empty">暂无地址，请先新增地址</div>'}
              </section>
              <section class="panel panel-pad" style="margin-bottom:16px">
                <h3>新增地址</h3>
                <form data-form="checkout-address">
                  <div class="form-grid">
                    <div class="field"><label>收货人</label><input name="receiver" required></div>
                    <div class="field"><label>手机号</label><input name="phone" pattern="1[3-9][0-9]{9}" required></div>
                    <div class="field"><label>省份</label><input name="province" required></div>
                    <div class="field"><label>城市</label><input name="city" required></div>
                    <div class="field"><label>区县</label><input name="district" required></div>
                    <div class="field"><label>详细地址</label><input name="detail" required></div>
                  </div>
                  <div class="form-actions"><button class="btn" type="submit">保存地址</button></div>
                </form>
              </section>
              <section class="panel panel-pad">
                <h3>商品明细</h3>
                ${details.map(item => `
                  <div class="list-card">
                    <img src="${item.product.image}" alt="${esc(item.product.name)}">
                    <div class="list-card-info"><strong>${esc(item.product.name)}</strong><span class="muted">¥${money(item.product.price)} × ${item.quantity}</span></div>
                    <strong class="price">¥${money(item.product.price * item.quantity)}</strong>
                  </div>`).join('')}
              </section>
            </div>
            <aside class="panel summary-card">
              <h3>订单汇总</h3>
              <div class="summary-row"><span>商品金额</span><strong>¥${money(total)}</strong></div>
              <div class="summary-row"><span>运费</span><strong>¥0.00</strong></div>
              <button class="btn btn-primary btn-block" style="margin-top:16px" data-action="place-order" data-address="${selectedAddressId}" ${selectedAddressId ? '' : 'disabled'}>提交订单</button>
            </aside>
          </div>
        </main>`;
    }

    function renderOrders() {
      const user = currentUser();
      if (!user) return authRequired('登录后查看订单');
      const orders = state.orders.filter(item => item.userId === user.id && (orderFilter === 'ALL' || item.status === orderFilter))
        .sort((a,b) => new Date(b.createTime) - new Date(a.createTime));
      const tabs = [['ALL','全部'],['PENDING_PAYMENT','待支付'],['PAID','待发货'],['SHIPPED','已发货'],['COMPLETED','已完成']];
      return userHeader() + `
        <main class="container page">
          <div class="section-heading"><div><h1 class="page-title">我的订单</h1><p class="page-subtitle">查看订单状态和商品明细。</p></div></div>
          <div class="filter-panel">
            ${tabs.map(tab => `<button class="btn btn-sm ${orderFilter === tab[0] ? 'btn-primary' : ''}" data-action="order-filter" data-status="${tab[0]}">${tab[1]}</button>`).join('')}
          </div>
          ${orders.length ? orders.map(order => `
            <article class="order-card">
              <div class="order-head">
                <div><strong>订单号：${esc(order.orderNo)}</strong><div class="muted">${new Date(order.createTime).toLocaleString()}</div></div>
                ${statusTag(order.status)}
              </div>
              <div class="order-body">
                ${order.items.map(item => `<div class="order-item"><img src="${item.productImage}"><div><strong>${esc(item.productName)}</strong><div class="muted">¥${money(item.price)} × ${item.quantity}</div></div><strong>¥${money(item.subtotal)}</strong></div>`).join('')}
              </div>
              <div class="order-foot">
                <span>实付 <strong class="price">¥${money(order.payAmount)}</strong></span>
                <div class="form-actions">
                  <a class="btn btn-sm" href="#/order/${order.id}">订单详情</a>
                  ${order.status === 'PENDING_PAYMENT' ? `<button class="btn btn-sm btn-danger" data-action="cancel-order" data-id="${order.id}">取消</button><button class="btn btn-sm btn-primary" data-action="pay-order" data-id="${order.id}">模拟支付</button>` : ''}
                </div>
              </div>
            </article>`).join('') : '<div class="empty">暂无订单</div>'}
        </main>`;

      return userHeader() + `
        <main class="container page">
          <div class="section-heading">
            <div><h1 class="page-title">订单详情</h1><p class="page-subtitle">订单号 ${esc(order.orderNo)}</p></div>
            ${statusTag(order.status)}

          <section class="panel panel-pad" style="margin-bottom:15px">

            <p>${esc(order.receiver)} ${esc(order.receiverPhone)}</p>
            <p class="muted">${esc(order.receiverAddress)}</p>
          </section>
          <section class="panel panel-pad">
            <h3>商品清单</h3>
            ${order.items.map(item => `<div class="list-card"><img src="${item.productImage}"><div class="list-card-info"><strong>${esc(item.productName)}</strong><span class="muted">¥${money(item.price)} × ${item.quantity}</span></div><strong>¥${money(item.subtotal)}</strong></div>`).join('')}
            <div class="summary-row summary-total"><span>实付金额</span><strong class="price">¥${money(order.payAmount)}</strong></div>
            ${order.status === 'PENDING_PAYMENT' ? `<div class="form-actions"><button class="btn btn-danger" data-action="cancel-order" data-id="${order.id}">取消订单</button><button class="btn btn-primary" data-action="pay-order" data-id="${order.id}">模拟支付</button></div>` : ''}
          </section>
        </main>`;

      const user = currentUser();
      if (!user) return authRequired('登录后进入个人中心');
      const editingAddress = (user.addresses || []).find(item => item.id === editingAddressId);
      return userHeader() + `
        <main class="container page">
          <div class="section-heading"><div><h1 class="page-title">个人中心</h1><p class="page-subtitle">管理资料和收货地址。</p></div></div>
          <div class="form-grid">
            <section class="panel panel-pad">
              <h3>个人资料</h3>
              <form data-form="profile">
                <div class="field"><label>用户名</label><input value="${esc(user.username)}" disabled></div>
                <div class="field" style="margin-top:14px"><label>昵称</label><input name="nickname" value="${esc(user.nickname)}" required></div>

                  <p>${esc(address.province + address.city + address.district + address.detail)}</p>
                  <div class="form-actions">
                    ${address.isDefault ? '' : `<button class="btn btn-sm" data-action="default-address" data-id="${address.id}">设为默认</button>`}

                    <button class="btn btn-sm btn-danger" data-action="delete-address" data-id="${address.id}">删除</button>

                <div class="field"><label>手机号</label><input name="phone" value="${esc(editingAddress ? editingAddress.phone : '')}" pattern="1[3-9][0-9]{9}" required></div>

            </form>
          </section>
        </main>`;

    function authRequired(message) {
      return userHeader() + `<main class="container page"><div class="empty">${esc(message)}<br><br><a class="btn btn-primary" href="#/login">去登录</a></div></main>`;
    }

    function renderLogin() {
      return `
        <div class="auth-page" style="--auth-image:url('${ASSETS.auth}')">
          <div class="auth-shell">
            <a class="brand" href="#/home"><span class="brand-mark">P</span><span class="brand-copy"><strong>PetMall</strong><small>宠物生活商城</small></span></a>

    function renderRegister() {
      return `
        <div class="auth-page" style="--auth-image:url('${ASSETS.auth}')">
          <div class="auth-shell">

    function addToCart(productId, quantity) {
      if (!currentUser()) {
        go('login');
        return;
      }
      const product = state.products.find(item => item.id === Number(productId));
      if (!product || product.status !== 1) return toast('商品不存在或已下架', true);
      const cart = userCart();
      const existing = cart.find(item => item.productId === product.id);
      const target = (existing ? existing.quantity : 0) + Number(quantity || 1);
      if (target > product.stock) return toast('库存不足', true);
      if (existing) existing.quantity = target;
      else cart.push({ id: Date.now() + Math.floor(Math.random() * 1000), productId: product.id, quantity: Number(quantity || 1) });
      saveState();
      toast('已加入购物车');
    }

    function createOrder(addressId) {
      const user = currentUser();
      const address = user.addresses.find(item => item.id === Number(addressId));
      const details = cartDetails().filter(item => selectedCartIds.has(item.id));
      if (!address) return toast('请选择有效地址', true);
      if (!details.length) return toast('请选择结算商品', true);
      for (const item of details) {
        if (item.product.status !== 1 || item.product.stock < item.quantity) return toast(item.product.name + ' 库存不足或已下架', true);
      }
      const total = details.reduce((sum, item) => sum + item.product.price * item.quantity, 0);
      const id = state.sequences.order++;
      const order = {
        id,
        orderNo: 'PM' + new Date().toISOString().slice(0, 10).replace(/-/g, '') + String(id).padStart(4, '0'),
        userId: user.id,
        totalAmount: total,
        payAmount: total,
        status: 'PENDING_PAYMENT',
        receiver: address.receiver,
        receiverPhone: address.phone,
        receiverAddress: address.province + address.city + address.district + address.detail,
        remark: '',
        createTime: new Date().toISOString(),
        payTime: null,
        items: details.map(item => {
          const itemId = state.sequences.orderItem++;
          item.product.stock -= item.quantity;
          item.product.sales += item.quantity;
          return {
            id: itemId,
            productId: item.product.id,
            productName: item.product.name,
            productImage: item.product.image,
            price: item.product.price,
            quantity: item.quantity,
            subtotal: item.product.price * item.quantity
          };
        })
      };
      state.orders.push(order);
      state.carts[user.id] = userCart().filter(item => !selectedCartIds.has(item.id));
      selectedCartIds.clear();
      saveState();
      if (confirm('订单已创建，是否立即进行模拟支付？')) {
        order.status = 'PAID';
        order.payTime = new Date().toISOString();
        saveState();
      }
      go('order/' + order.id);
    }

    }

    function optimizeImage(file) {
      return new Promise((resolve, reject) => {
        if (!file) return resolve('');
        const reader = new FileReader();
        reader.onload = () => {
          const image = new Image();
          image.onload = () => {
            const max = 800;
            let width = image.width;
            let height = image.height;
            if (width > max || height > max) {
              const ratio = Math.min(max / width, max / height);
              width = Math.round(width * ratio);
              height = Math.round(height * ratio);
            }
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            canvas.getContext('2d').drawImage(image, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', .82));
          };
          image.onerror = reject;
          image.src = reader.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function resizeCanvas(canvas) {
      const dpr = window.devicePixelRatio || 1;
      const width = canvas.clientWidth || 500;
      const height = canvas.clientHeight || 280;
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      const ctx = canvas.getContext('2d');
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      return { ctx, width, height };
    }

    function drawDashboardCharts() {
      drawTrendChart(document.querySelector('[data-chart="trend"]'));
      drawStatusChart(document.querySelector('[data-chart="status"]'));
      drawHotChart(document.querySelector('[data-chart="hot"]'));
      drawCategoryChart(document.querySelector('[data-chart="category"]'));
    }

    function chartBase(canvas) {
      const canvasData = resizeCanvas(canvas);
      canvasData.ctx.clearRect(0, 0, canvasData.width, canvasData.height);
      canvasData.ctx.font = '12px Arial';
      canvasData.ctx.lineWidth = 1;
      return canvasData;
    }

    function drawTrendChart(canvas) {
      if (!canvas) return;
      const { ctx, width, height } = chartBase(canvas);
      const days = [];
      const sales = [];
      const counts = [];
      for (let i = 6; i >= 0; i--) {
        const date = new Date();
        date.setDate(date.getDate() - i);
        const key = date.toISOString().slice(0, 10);
        days.push((date.getMonth() + 1) + '/' + date.getDate());
        const dayOrders = state.orders.filter(order => order.createTime.slice(0, 10) === key);
        counts.push(dayOrders.length);
        sales.push(dayOrders.filter(validRevenue).reduce((sum, order) => sum + Number(order.payAmount), 0));
      }
      const max = Math.max(100, ...sales);
      const left = 42, right = width - 18, top = 22, bottom = height - 32;
      ctx.strokeStyle = '#e4e7ec';
      for (let i = 0; i <= 4; i++) {
        const y = top + (bottom - top) * i / 4;
        ctx.beginPath(); ctx.moveTo(left, y); ctx.lineTo(right, y); ctx.stroke();
      }
      ctx.strokeStyle = '#2563eb'; ctx.lineWidth = 3; ctx.beginPath();
      sales.forEach((value, index) => {
        const x = left + (right - left) * index / 6;
        const y = bottom - (bottom - top) * value / max;
        index ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
      });
      ctx.stroke();
      ctx.fillStyle = '#667085';
      days.forEach((day, index) => ctx.fillText(day, left + (right - left) * index / 6 - 12, height - 10));
      ctx.fillStyle = '#172033'; ctx.fillText('最高 ¥' + money(max), left, 13);
    }

    function drawStatusChart(canvas) {
      if (!canvas) return;
      const { ctx, width, height } = chartBase(canvas);
      const entries = Object.keys(ORDER_STATUS).map(status => [status, state.orders.filter(order => order.status === status).length]).filter(item => item[1]);
      const colors = ['#f59e0b','#2563eb','#0891b2','#16a34a','#98a2b3','#dc2626'];
      const total = entries.reduce((sum, item) => sum + item[1], 0) || 1;
      const cx = width / 2, cy = height / 2 - 6, radius = Math.min(width, height) * .3;
      let start = -Math.PI / 2;
      entries.forEach((entry, index) => {
        const angle = Math.PI * 2 * entry[1] / total;
        ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, radius, start, start + angle); ctx.closePath();
        ctx.fillStyle = colors[index % colors.length]; ctx.fill();
        start += angle;
      });
      ctx.beginPath(); ctx.arc(cx, cy, radius * .55, 0, Math.PI * 2); ctx.fillStyle = '#fff'; ctx.fill();
      ctx.fillStyle = '#172033'; ctx.textAlign = 'center'; ctx.font = '700 18px Arial'; ctx.fillText(total + ' 单', cx, cy + 5);
      ctx.textAlign = 'left'; ctx.font = '12px Arial';
      entries.forEach((entry, index) => {
        const y = 16 + index * 19;
        ctx.fillStyle = colors[index % colors.length]; ctx.fillRect(12, y, 9, 9);
        ctx.fillStyle = '#475467'; ctx.fillText(ORDER_STATUS[entry[0]] + ' ' + entry[1], 27, y + 9);
      });
    }

    function drawHotChart(canvas) {
      if (!canvas) return;
      const { ctx, width, height } = chartBase(canvas);
      const items = [...state.products].sort((a,b) => b.sales - a.sales).slice(0, 6);
      const max = Math.max(1, ...items.map(item => item.sales));
      items.forEach((item, index) => {
        const y = 20 + index * 39;
        ctx.fillStyle = '#475467'; ctx.fillText(item.name.slice(0, 13), 8, y + 13);
        ctx.fillStyle = '#e4e7ec'; ctx.fillRect(145, y, width - 190, 17);
        ctx.fillStyle = '#2563eb'; ctx.fillRect(145, y, (width - 190) * item.sales / max, 17);
        ctx.fillStyle = '#172033'; ctx.fillText(item.sales, width - 38, y + 13);
      });
    }

    function drawCategoryChart(canvas) {
      if (!canvas) return;
      const { ctx, width, height } = chartBase(canvas);
      const items = state.categories.map(category => ({
        name: category.name,
        value: state.products.filter(product => product.categoryId === category.id).length
      }));
      const max = Math.max(1, ...items.map(item => item.value));
      const barWidth = Math.max(36, (width - 70) / items.length - 14);
      items.forEach((item, index) => {
        const x = 40 + index * ((width - 70) / items.length);
        const barHeight = (height - 65) * item.value / max;
        ctx.fillStyle = '#e4e7ec'; ctx.fillRect(x, 20, barWidth, height - 65);
        ctx.fillStyle = '#0891b2'; ctx.fillRect(x, height - 45 - barHeight, barWidth, barHeight);
        ctx.fillStyle = '#475467'; ctx.fillText(item.name, x, height - 18);
        ctx.fillStyle = '#172033'; ctx.fillText(item.value, x + barWidth / 2 - 5, height - 52 - barHeight);
      });
    }

    app.addEventListener('click', async event => {
      const target = event.target.closest('[data-action]');
      if (!target) return;
      const action = target.dataset.action;
      const id = Number(target.dataset.id);
      if (action === 'user-logout') {
        state.session = { mode: null, userId: null, employeeId: null };
        selectedCartIds.clear(); saveState(); go('home'); toast('已退出登录');
      } else if (action === 'admin-logout') {
        state.session = { mode: null, userId: null, employeeId: null };
        saveState(); go('admin-login'); toast('已退出后台');
      } else if (action === 'reset-demo') {
        if (confirm('确认重置全部演示数据吗？新增的商品、订单和账号都会被清除。')) {
          state = defaultState();
          selectedCartIds.clear();
          editingEmployeeId = editingCategoryId = editingProductId = modalOrderId = editingAddressId = null;
          saveState();
          go('admin/dashboard');
          toast('演示数据已重置');
        }
      } else if (action === 'add-cart') {
        addToCart(id, 1);
      } else if (action === 'detail-qty') {
        const node = document.getElementById('detail-qty');
        node.textContent = Math.max(1, Number(node.textContent) + Number(target.dataset.step));
      } else if (action === 'add-cart-detail') {
        addToCart(id, Number(document.getElementById('detail-qty').textContent));
      } else if (action === 'buy-now') {
        addToCart(id, Number(document.getElementById('detail-qty').textContent));
        if (currentUser()) go('cart');
      } else if (action === 'cart-select') {
        id && (selectedCartIds.has(id) ? selectedCartIds.delete(id) : selectedCartIds.add(id));
        render();
      } else if (action === 'cart-qty') {
        const item = userCart().find(item => item.id === id);
        const product = state.products.find(product => product.id === item.productId);
        const next = item.quantity + Number(target.dataset.step);
        if (next < 1) return;
        if (next > product.stock) return toast('库存不足', true);
        item.quantity = next; saveState(); render();
      } else if (action === 'cart-remove') {
        const user = currentUser();
        state.carts[user.id] = userCart().filter(item => item.id !== id);
        selectedCartIds.delete(id); saveState(); render(); toast('已删除购物车商品');
      } else if (action === 'checkout') {
        go('checkout');
      } else if (action === 'select-checkout-address') {
        go('checkout?addressId=' + id);
      } else if (action === 'place-order') {
        createOrder(target.dataset.address);
      } else if (action === 'order-filter') {
        orderFilter = target.dataset.status; render();
      } else if (action === 'pay-order') {
        const order = state.orders.find(item => item.id === id);
        if (order && order.status === 'PENDING_PAYMENT' && confirm('确认模拟支付 ¥' + money(order.payAmount) + ' 吗？')) {
          order.status = 'PAID'; order.payTime = new Date().toISOString(); saveState(); render(); toast('支付成功');
        }
      } else if (action === 'cancel-order') {
        const order = state.orders.find(item => item.id === id);
        if (order && order.status === 'PENDING_PAYMENT' && confirm('确认取消订单吗？库存将自动回补。')) {
          restoreOrderStock(order); order.status = 'CANCELLED'; saveState(); render(); toast('订单已取消');
        }
      } else if (action === 'new-address') {
        editingAddressId = null; render();
      } else if (action === 'edit-address') {
        editingAddressId = id; render();
      } else if (action === 'cancel-address-edit') {
        editingAddressId = null; render();
      } else if (action === 'default-address') {
        const user = currentUser();
        user.addresses.forEach(item => item.isDefault = item.id === id ? 1 : 0);
        saveState(); render(); toast('已设为默认地址');
      } else if (action === 'delete-address') {
        const user = currentUser();
        if (confirm('确认删除该地址吗？')) {
          user.addresses = user.addresses.filter(item => item.id !== id);
          saveState(); render(); toast('地址已删除');
        }
      } else if (action === 'new-product') {
        editingProductId = null; render();
      } else if (action === 'edit-product') {
        editingProductId = id; render();
      } else if (action === 'cancel-product') {
        editingProductId = null; render();
      } else if (action === 'toggle-product') {
        const product = state.products.find(item => item.id === id); product.status = product.status ? 0 : 1; saveState(); render();
      } else if (action === 'delete-product') {
        if (confirm('确认删除该商品吗？')) { state.products = state.products.filter(item => item.id !== id); saveState(); render(); toast('商品已删除'); }
      } else if (action === 'edit-category') {
        editingCategoryId = id; render();
      } else if (action === 'cancel-category') {
        editingCategoryId = null; render();
      } else if (action === 'delete-category') {
        if (state.products.some(item => item.categoryId === id)) toast('分类下存在商品，无法删除', true);
        else if (confirm('确认删除分类吗？')) { state.categories = state.categories.filter(item => item.id !== id); saveState(); render(); }
      } else if (action === 'edit-employee') {
        editingEmployeeId = id; render();
      } else if (action === 'cancel-employee') {
        editingEmployeeId = null; render();
      } else if (action === 'toggle-employee') {
        const employee = state.employees.find(item => item.id === id); employee.status = employee.status ? 0 : 1; saveState(); render();
      } else if (action === 'admin-view-order') {
        modalOrderId = id; render();
      } else if (action === 'close-order-modal') {
        if (event.target === target || event.target.closest('.modal') === null || target.textContent === '关闭') {
          modalOrderId = null; render();
        }
      } else if (action === 'admin-order-status') {
        const order = state.orders.find(item => item.id === id);
        const next = target.dataset.status;
        if (order && confirm('确认将订单状态修改为 ' + ORDER_STATUS[next] + ' 吗？')) {
          if (['CANCELLED','REFUNDED'].includes(next) && !['CANCELLED','REFUNDED'].includes(order.status)) restoreOrderStock(order);
          order.status = next;
          if (next === 'PAID') order.payTime = order.payTime || new Date().toISOString();
          saveState(); render(); toast('订单状态已更新');
        }
      } else if (action === 'reset-product-filter') {
        productFilter = { keyword: '', categoryId: '' }; render();
      }
    });

    app.addEventListener('change', async event => {
      if (event.target.id === 'product-image-file') {
        try {
          const image = await optimizeImage(event.target.files[0]);
          document.getElementById('product-image-value').value = image;
          document.getElementById('image-preview').src = image;
          toast('图片已压缩，保存商品后生效');
        } catch (error) {
          toast('图片处理失败', true);
        }
      }
    });

    app.addEventListener('submit', event => {
      event.preventDefault();
      const action = event.target.dataset.form;
      const form = event.target;
      const data = formData(form);
      if (action === 'login') {
        const user = state.users.find(item => item.username === data.username && item.password === data.password);
        if (!user) return toast('账号或密码错误', true);
        state.session = { mode: 'user', userId: user.id, employeeId: null }; saveState(); go('home'); toast('登录成功');
      } else if (action === 'register') {
        if (state.users.some(item => item.username === data.username)) return toast('用户名已存在', true);
        const user = { id: state.sequences.user++, username: data.username, password: data.password, nickname: data.nickname, phone: data.phone, addresses: [] };
        state.users.push(user); state.session = { mode: 'user', userId: user.id, employeeId: null }; saveState(); go('home'); toast('注册成功');
      } else if (action === 'admin-login') {
        const employee = state.employees.find(item => item.username === data.username && item.password === data.password && item.status === 1);
        if (!employee) return toast('员工账号或密码错误', true);
        state.session = { mode: 'admin', userId: null, employeeId: employee.id }; saveState(); go('admin/dashboard'); toast('登录成功');
      } else if (action === 'profile') {
        const user = currentUser(); user.nickname = data.nickname; user.phone = data.phone; saveState(); render(); toast('资料已保存');
      } else if (action === 'profile-address' || action === 'checkout-address') {
        const user = currentUser();
        const address = {
          id: data.id ? Number(data.id) : state.sequences.address++,
          receiver: data.receiver, phone: data.phone, province: data.province,
          city: data.city, district: data.district, detail: data.detail,
          isDefault: user.addresses.length ? 0 : 1
        };
        const index = user.addresses.findIndex(item => item.id === address.id);
        if (index >= 0) user.addresses[index] = address; else user.addresses.push(address);
        saveState(); editingAddressId = null;
        if (action === 'checkout-address') go('checkout?addressId=' + address.id); else render();
        toast('地址已保存');
      } else if (action === 'product-filter') {
        productFilter = { keyword: data.keyword, categoryId: data.categoryId }; render();
      } else if (action === 'admin-product-filter') {
        productFilter.keyword = data.keyword; render();
      } else if (action === 'employee') {
        const employee = data.id ? state.employees.find(item => item.id === Number(data.id)) : { id: state.sequences.employee++ };
        employee.username = data.username; employee.password = data.password; employee.realName = data.realName;
        employee.phone = data.phone; employee.role = data.role; employee.status = Number(data.status);
        if (!data.id) state.employees.push(employee);
        editingEmployeeId = null; saveState(); render(); toast('员工已保存');
      } else if (action === 'category') {
        const category = data.id ? state.categories.find(item => item.id === Number(data.id)) : { id: state.sequences.category++ };
        category.name = data.name; category.sort = Number(data.sort); category.status = Number(data.status);
        if (!data.id) state.categories.push(category);
        editingCategoryId = null; saveState(); render(); toast('分类已保存');
      } else if (action === 'product') {
        const editing = data.id ? state.products.find(item => item.id === Number(data.id)) : null;
        const product = editing || { id: state.sequences.product++, sales: 0, image: ASSETS.placeholder };
        product.categoryId = Number(data.categoryId); product.name = data.name; product.subtitle = data.subtitle;
        product.price = Number(data.price); product.stock = Number(data.stock); product.status = Number(data.status);
        product.detail = data.detail;
        if (data.image) product.image = data.image;
        if (!editing) state.products.push(product);
        editingProductId = null; saveState(); render(); toast('商品已保存');
      }
    });

    window.addEventListener('hashchange', () => {
      selectedCartIds = new Set([...selectedCartIds].filter(id => userCart().some(item => item.id === id)));
      render();
    });
    window.addEventListener('resize', () => {
      if (route()[0] === 'admin' && (!route()[1] || route()[1] === 'dashboard')) drawDashboardCharts();
    });

    state = loadState();
    if (!location.hash) location.hash = '#/home';
    render();
  </script>
</body>
</html>
